  # ======================================================================
  # DAILY: Forge a Bond (Lost Scrolls II)
  # ----------------------------------------------------------------------
  # Three ways in — recruit, level, or win a duel — all sharing one key, so a
  # player with an established company still has a route.
  # These trigger types are raised by Lost Scrolls II via its ServerGuideBridge;
  # on a server without that mod they simply never fire.
  # ======================================================================
  - id: vc_daily_bond_recruit
    title: "Forge a Bond"
    category: Support
    version: 1
    once: false
    scope: player
    trigger:
      type: dvergr_recruited
    display:
      mode: message
      position: Center
      text: "One of the small folk chooses to walk with you."
    description: "Recruit, level, or win a duel with a Dvergr companion."
    rewards:
      - type: set_player_key
        key: VC.Q.daily_bond

  - id: vc_daily_bond_levelup
