  # ======================================================================
  # DAILY: Tend the Beasts — tame anything
  # ----------------------------------------------------------------------
  # The one non-combat daily. No `creature:` filter, so any tame counts.
  # ======================================================================
  - id: vc_daily_tame
    title: "Tend the Beasts"
    category: Support
    version: 1
    once: false
    cooldown: 30           # guards against a double-fire on one Tame() call
    scope: player
    trigger:
      type: tamed_creature
    display:
      mode: message
      position: Center
      text: "A wild thing learns to trust you."
    description: "Tame any creature."
    rewards:
